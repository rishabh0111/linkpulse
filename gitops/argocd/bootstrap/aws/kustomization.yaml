# The EKS bootstrap: the root Application pointed at GitHub. No in-cluster Service is
# needed for a public remote. Unverified until the burst.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - ../base
patches:
  - target:
      kind: Application
      name: root
    patch: |
      - op: replace
        path: /spec/source/repoURL
        value: https://github.com/OWNER/linkpulse.git
      - op: replace
        path: /spec/source/path
        value: gitops/argocd/apps/aws
