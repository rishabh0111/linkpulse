# Sealed Secrets, as a platform Application at wave -2 alongside cert-manager: the
# SealedSecret CRD has to exist before the monitoring overlay on EKS (wave 1) applies
# objects of that kind. Locally nothing is sealed -- the local overlays use literal
# fixtures -- so here it is proven to work (`mise run seal-check`) rather than relied on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://gitea:3000/linkpulse/linkpulse.git
    targetRevision: main
    path: platform/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
