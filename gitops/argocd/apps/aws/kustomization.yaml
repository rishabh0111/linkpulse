# The EKS set: the local set with two fields patched -- the repository the Applications
# read from and the overlay path they deploy. That the diff is this small is the point:
# the GitOps layer is exactly as portable as the manifests underneath it.
#
# Unverified: no EKS cluster has existed yet. Rendered and checked in CI, never applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../local

patches:
  - target:
      kind: Application
      name: linkpulse
    patch: |
      # The real repository. It was an OWNER placeholder until the repository went public
      # before the burst; it is the one identifier in the repo that is mine and not the
      # project's.
      - op: replace
        path: /spec/source/repoURL
        value: https://github.com/rishabh0111/linkpulse.git
      - op: replace
        path: /spec/source/path
        value: k8s/manifests/overlays/aws
  - target:
      kind: Application
      name: monitoring
    patch: |
      - op: replace
        path: /spec/source/repoURL
        value: https://github.com/rishabh0111/linkpulse.git
      - op: replace
        path: /spec/source/path
        value: monitoring/overlays/aws
  # The platform Applications have no per-environment overlay -- a CA issuer and a
  # secret decrypter are the same shape on k3d and on EKS -- so only the repository
  # changes. That the path does not is the portability claim applied to the platform.
  - target:
      kind: Application
      name: cert-manager
    patch: |
      - op: replace
        path: /spec/source/repoURL
        value: https://github.com/rishabh0111/linkpulse.git
  - target:
      kind: Application
      name: sealed-secrets
    patch: |
      - op: replace
        path: /spec/source/repoURL
        value: https://github.com/rishabh0111/linkpulse.git
