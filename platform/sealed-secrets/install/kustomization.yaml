# Sealed Secrets: how a secret gets into git without being in git.
#
# The problem it solves is specific to this project's aws overlays. Locally every secret
# is a fixture (LocalStack accepts any credential; the Discord webhook is a placeholder),
# so the local overlays generate them from literals and nothing is lost by committing
# those. On EKS two of them are real -- the Discord webhook URL and the Grafana admin
# password -- and ArgoCD deploys from git, so either they are committed or a human
# applies them by hand after every cluster rebuild. Neither is acceptable in a repository
# whose point is that the cluster is fully described by what is committed.
#
# A SealedSecret is the Secret encrypted to a key only this controller holds. It can be
# committed, ArgoCD applies it like any other object, and the controller decrypts it into
# the real Secret in-cluster. kubeseal (in the ops tool container) does the encrypting,
# against the public half of the key -- so sealing needs no cluster access at all, only
# the certificate committed at platform/sealed-secrets/sealing-cert.crt.
#
# The key pair is generated by the controller on first start. That is the right default
# and also the trap: a cluster rebuilt from scratch has a new key and cannot read anything
# sealed for the old one. `mise run seal-export` backs the key up (gitignored) and
# `platform-apply` restores it before the controller starts, so a rebuilt cluster -- k3d
# after `mise run clean`, or EKS at the start of the burst -- reads what was sealed
# before it existed.
#
# Vendored from the v0.40.0 release, unmodified under upstream/; namespace and labels are
# patched here. The upstream file installs into kube-system, which would work and would
# also mean the platform AppProject had to be allowed to write there. Its own namespace
# keeps the boundary tight and gives the controller a Pod Security profile of its own.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sealed-secrets

resources:
  - namespace.yaml
  - upstream/controller-v0.40.0.yaml

patches:
  # Upstream sets no resources. Same reasoning as cert-manager's install: requests so the
  # scheduler has real numbers, a memory limit so a leak cannot take a node down, and no
  # CPU limit.
  - target:
      kind: Deployment
      name: sealed-secrets-controller
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
