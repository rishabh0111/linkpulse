# The image renderer, beside Grafana rather than in docker-compose.yml where it started.
#
# It moved because of a plain networking fact: rendering is a round trip. Grafana calls
# the renderer, and the renderer's headless Chromium then calls *back* to Grafana to load
# the panel. From a compose container that callback would have to cross into the cluster
# through the ingress by hostname, and localtest.me resolves to 127.0.0.1 -- the renderer
# itself. In-cluster, both legs are plain Service names. It also means the aws overlay
# deploys it identically, which a compose service never could.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-renderer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-renderer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-renderer
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: renderer
          image: grafana/grafana-image-renderer:3.12.9
          env:
            - name: ENABLE_METRICS
              value: "true"
            - name: HTTP_HOST
              value: "0.0.0.0"
            - name: HTTP_PORT
              value: "8081"
            - name: RENDERING_MODE
              value: default
            # Chromium's own sandbox needs privileges the container does not have; the
            # sandbox is off and the container is unprivileged instead, which is the
            # documented arrangement for this image.
            - name: RENDERING_ARGS
              value: --no-sandbox,--disable-gpu
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Chromium. The largest single request in the cluster, sized for one render
              # at a time, which is all the evidence pipeline does.
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Chromium writes profiles and crash dumps to /tmp; a dedicated volume keeps them
        # off the container layer, which fills after a few dozen renders otherwise.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-renderer
spec:
  selector:
    app.kubernetes.io/name: grafana-renderer
  ports:
    - name: http
      port: 8081
      targetPort: http
