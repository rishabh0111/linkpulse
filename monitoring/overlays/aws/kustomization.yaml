# EKS: the base, the CloudWatch exporter for DynamoDB's own metrics, and the two Secrets
# the base deliberately does not contain -- sealed, so a real Discord webhook URL and a
# real Grafana password can sit in git encrypted (platform/sealed-secrets explains the
# mechanism). Unverified until the burst.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - ../../base
  - cloudwatch-exporter.yaml
  # Generated by `mise run seal`, never hand-edited, and what is committed today is
  # sealed PLACEHOLDERS -- the same non-values the local overlay uses in plain text. They
  # decrypt only in a cluster holding the key that platform/sealed-secrets/sealing-cert.crt
  # is the public half of, which the burst runbook restores from the operator's backup
  # before the controller starts. Before the burst, both are re-sealed with real values:
  #
  #   mise run seal -- monitoring alertmanager-discord monitoring/overlays/aws/sealed/alertmanager-discord.yaml webhook-url=https://discord.com/api/webhooks/...
  #   mise run seal -- monitoring grafana-admin       monitoring/overlays/aws/sealed/grafana-admin.yaml       password=...
  #
  # Committing sealed placeholders rather than nothing is deliberate: it keeps the
  # overlay renderable and applyable end to end, so the shape of the aws deployment is
  # exercised in CI and by ArgoCD's dry run, and the only thing the burst changes is two
  # encrypted values.
  - sealed/alertmanager-discord.yaml
  - sealed/grafana-admin.yaml

patches:
  - target:
      kind: Deployment
      name: grafana
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: https://grafana.linkpulse.example.invalid
