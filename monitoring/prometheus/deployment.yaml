apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  # Recreate, not RollingUpdate: with an emptyDir there is nothing to hand over, and two
  # Prometheus instances briefly evaluating the same rules would double-fire every alert
  # mid-rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.9.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Two days. The evidence pipeline copies the series that matter out to
            # docs/evidence/ as JSON at the end of each experiment, so retention only has
            # to cover the run itself plus a night's sleep before it is looked at.
            - --storage.tsdb.retention.time=2d
            - --web.enable-lifecycle
            # The chaos scripts render dashboards from Grafana, but they also read
            # /api/v1/query_range directly; this keeps the API on the well-known path.
            - --web.route-prefix=/
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        # emptyDir, knowingly. A PVC would survive a pod restart, but this cluster's
        # storage class is local-path -- node-bound -- so it would NOT survive experiment 5
        # killing the node it lives on, and would leave Prometheus unschedulable rather
        # than merely amnesiac. The evidence that matters is exported to files; the TSDB
        # is a cache.
        - name: data
          emptyDir: {}
