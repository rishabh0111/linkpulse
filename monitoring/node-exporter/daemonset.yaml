apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
    spec:
      # Host namespaces, because the thing being measured is the host. This is the other
      # reason the monitoring namespace is `privileged` under Pod Security Admission
      # rather than `restricted`.
      # Node-critical, so this schedules on every node even when it is full. On EKS a
      # node accepts a fixed number of pods (11 on a t3.small, set by the VPC CNI), and
      # ordinary pods filled two nodes before the DaemonSets were placed -- leaving those
      # nodes with no metrics, silently, because a DaemonSet pod that cannot schedule is
      # Pending rather than failed.
      priorityClassName: system-node-critical
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.10.0
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --web.listen-address=0.0.0.0:9100
            # On k3d the "node" is a container and most of these collectors read the
            # Docker host's view rather than the node's, or nothing at all.
            - --collector.disable-defaults
            - --collector.cpu
            - --collector.meminfo
            - --collector.loadavg
            - --collector.filesystem
            - --collector.netdev
            - --collector.uname
          ports:
            - name: http
              containerPort: 9100
              hostPort: 9100
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
