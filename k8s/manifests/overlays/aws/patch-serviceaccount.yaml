apiVersion: v1
kind: ServiceAccount
metadata:
  name: linkpulse
  annotations:
    # IRSA. The mutating webhook in EKS watches for this annotation and injects
    # AWS_ROLE_ARN, AWS_WEB_IDENTITY_TOKEN_FILE and a projected service account token with
    # the sts.amazonaws.com audience. The SDK's default credential chain picks those up
    # with no application change at all, which is why internal/config has no notion of
    # IRSA and does not need one.
    #
    # The account ID is a placeholder; infra/terraform/envs/aws-burst outputs the real ARN
    # and the burst runbook substitutes it. It is not committed because the account ID is
    # the one piece of this repository that is specific to my AWS account.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/linkpulse-burst-irsa
