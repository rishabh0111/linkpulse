# A dedicated ServiceAccount rather than `default`.
#
# It carries no permissions here and mounts no token (see the Deployment), so on k3d it
# looks like a no-op. It is not: during the EKS burst this is the object the IRSA trust
# policy names, and `system:serviceaccount:linkpulse:linkpulse` is what the IAM role's
# assume-role condition matches on. Creating it in the base means the AWS overlay only has
# to add an annotation, rather than introduce an object the local path has never exercised.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: linkpulse
automountServiceAccountToken: false
